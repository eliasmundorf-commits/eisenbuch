<title>Eisenbuch</title>
<style>
/* Layout: one phone column; blurred sticky header with week strip, cards in the middle, iOS tab bar + floating rest timer at the bottom. Deliberately dark-only. */
:root {
  --bg: #000000;
  --surface: #121214;
  --surface-2: #1d1d21;
  --surface-3: #2a2a30;
  --line: #26262b;
  --fg: #f5f5f7;
  --fg-2: #a1a1aa;
  --fg-3: #67676f;
  --accent: #c6f432;          /* neon lime */
  --accent-ink: #0b0d02;
  --accent-dim: rgba(198, 244, 50, .14);
  --cardio: #38d3ff;
  --rest: #b69cff;
  --warn: #ffb340;
  --warn-dim: rgba(255, 179, 64, .12);
  --red: #ff453a;
  --font: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --r: 18px;
  --tabbar: 56px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(0,0,0,.82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(0,0,0,.82); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border-bottom: .5px solid var(--line); }
header.top .wrap { padding-block: 8px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.week button { border: 0; background: transparent; border-radius: 14px; padding: 6px 0 7px; display: grid; justify-items: center; gap: 3px; }
.week .wd { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-3); }
.week .dn { font-family: var(--font-num); font-weight: 700; font-size: 19px; line-height: 1; color: var(--fg-2); }
.week .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px var(--k, transparent); }
.week .dot.done { background: var(--k); }
.week button.today .dn { color: var(--accent); }
.week button[aria-pressed="true"] { background: var(--surface-2); }
.week button[aria-pressed="true"] .dn { color: var(--fg); }
.week button.today[aria-pressed="true"] .dn { color: var(--accent); }

main .wrap { padding-block: 18px calc(var(--tabbar) + 110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }

/* titles */
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.title { margin: 2px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; text-wrap: balance; }
.sub { color: var(--fg-2); font-size: 15px; }
.head { display: grid; gap: 4px; }
.kind-k { --k: var(--accent); } .kind-c { --k: var(--cardio); } .kind-e { --k: var(--rest); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--k, var(--accent)); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--font-num); font-weight: 800; font-size: 24px; line-height: 1.1; letter-spacing: -.01em; white-space: nowrap; }
.stat .v small { font-size: 14px; color: var(--fg-3); font-weight: 700; }
.stat .k { font-size: 12px; color: var(--fg-3); font-weight: 600; }
.stat.hi .v { color: var(--accent); }
.bar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .35s ease; }

/* pill buttons */
.pill { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; position: relative; }
.pill .chev { color: var(--fg-3); }
.pill.phase b { color: var(--accent); font-weight: 700; }
.pill select { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }

/* install hint */
.hint { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; font-size: 14px; color: var(--fg-2); }
.hint b { color: var(--fg); }
.hint .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* exercise card */
.ex { background: var(--surface); border-radius: var(--r); padding: 14px 14px 10px; display: grid; gap: 10px; }
.ex-head { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.ex-name { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; display: flex; gap: 8px; align-items: baseline; }
.ex-name .i { font-family: var(--font-num); font-size: 14px; font-weight: 800; color: var(--fg-3); min-width: 14px; }
.ex.complete .ex-name .i { color: var(--accent); }
.ex-target { font-family: var(--font-num); font-weight: 700; font-size: 15px; color: var(--fg-2); white-space: nowrap; text-align: right; }
.ex-target small { display: block; font-family: var(--font); font-weight: 500; font-size: 12px; color: var(--fg-3); }
.ex-note { border: 0; background: none; padding: 0; text-align: left; font-size: 14px; color: var(--fg-3); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.ex-note.open { -webkit-line-clamp: unset; color: var(--fg-2); }
.alt { font-size: 13px; color: var(--warn); background: var(--warn-dim); border-radius: 10px; padding: 7px 10px; }
.last { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; color: var(--fg-3); }
.last b { color: var(--fg-2); font-weight: 600; font-family: var(--font-num); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--fg-2); }
.chip.up { background: var(--accent-dim); color: var(--accent); }
.chip.pr { background: var(--accent); color: var(--accent-ink); }

.sets { display: grid; gap: 6px; }
.srow { display: grid; grid-template-columns: 22px 1fr 1fr 52px; gap: 8px; align-items: center; }
.srow.one { grid-template-columns: 22px 1fr 52px; }
.srow.lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.srow.lbl span { text-align: center; }
.srow .n { font-family: var(--font-num); font-weight: 800; font-size: 15px; color: var(--fg-3); text-align: center; }
.srow input { width: 100%; min-width: 0; height: 52px; border: 0; border-radius: 14px; background: var(--surface-2); text-align: center; font-family: var(--font-num); font-size: 22px; font-weight: 700; color: var(--fg); -webkit-appearance: none; appearance: none; }
.srow input::placeholder { color: var(--fg-3); font-weight: 600; }
.srow input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.tick { height: 52px; border: 0; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; transition: background .15s, transform .1s; }
.tick:active { transform: scale(.94); }
.tick svg { width: 24px; height: 24px; stroke: var(--fg-3); }
.srow.done .tick { background: var(--accent); }
.srow.done .tick svg { stroke: var(--accent-ink); }
.srow.done input { background: var(--accent-dim); color: var(--accent); }
.srow.done .n { color: var(--accent); }
.ex-foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--fg-3); min-height: 32px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px 4px; }
.link.muted { color: var(--fg-2); }
.link.danger { color: var(--red); }

textarea { width: 100%; min-height: 80px; border: 0; border-radius: 14px; background: var(--surface); padding: 12px 14px; resize: vertical; font-size: 16px; }
textarea::placeholder { color: var(--fg-3); }
.big { width: 100%; height: 56px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 800; letter-spacing: .01em; }
.big.ghost { background: var(--surface); color: var(--fg); }
.big:active { transform: scale(.99); }

.summary { background: linear-gradient(160deg, rgba(198,244,50,.18), rgba(198,244,50,.04)); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.summary .stat { background: rgba(0,0,0,.35); }
.empty { background: var(--surface); border-radius: var(--r); padding: 28px 18px; text-align: center; color: var(--fg-2); display: grid; gap: 8px; justify-items: center; font-size: 15px; }
.empty h3 { margin: 0; font-size: 20px; color: var(--fg); }

/* history */
.panel { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.panel h3 { margin: 0; font-size: 17px; font-weight: 700; }
.panel .stat { background: var(--surface-2); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -120%); }
.list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: .5px solid var(--line); min-height: 48px; width: 100%; border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; font-size: 16px; }
.li:first-child { border-top: 0; }
button.li:active { background: var(--surface-2); }
.li .l { color: var(--fg-3); font-size: 14px; font-family: var(--font-num); font-weight: 600; min-width: 56px; }
.li .m { min-width: 0; overflow-wrap: anywhere; }
.li .m small { display: block; color: var(--fg-3); font-size: 13px; }
.li .r { color: var(--fg-2); font-size: 14px; font-family: var(--font-num); font-weight: 600; text-align: right; }
.li .chev { color: var(--fg-3); }
.section-t { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); padding: 6px 4px 0; }
.foot-note { font-size: 13px; color: var(--fg-3); padding: 0 4px; }

/* form rows (settings style) */
.frow { display: grid; grid-template-columns: 1fr minmax(0, 1.2fr); gap: 12px; align-items: center; padding: 6px 14px; min-height: 48px; border-top: .5px solid var(--line); }
.frow:first-child { border-top: 0; }
.frow > span { font-size: 16px; }
.frow input, .frow select { width: 100%; min-width: 0; border: 0; background: transparent; text-align: right; font-size: 16px; color: var(--fg-2); padding: 8px 0; -webkit-appearance: none; appearance: none; }
.frow input:focus { color: var(--fg); outline: none; }
.frow select { direction: rtl; }
.frow.stack { grid-template-columns: 1fr; gap: 4px; padding-block: 10px; }
.frow.stack input, .frow.stack textarea { text-align: left; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; color: var(--fg); }
.frow.stack textarea { min-height: 70px; }
.switch { position: relative; width: 51px; height: 31px; justify-self: end; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.navbar { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
.back { border: 0; background: none; color: var(--accent); font-size: 17px; font-weight: 500; padding: 4px 0; display: inline-flex; align-items: center; gap: 2px; }
.confirm { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 8px 14px; font-size: 14px; color: var(--fg-2); flex-wrap: wrap; }

/* technique panel + figures */
.tech { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; border: 0; background: none; padding: 0; text-align: left; color: var(--fg-3); font-size: 14px; width: 100%; }
.tech .tx { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tech.open .tx { -webkit-line-clamp: unset; color: var(--fg-2); }
.tech .chev { color: var(--fg-3); transition: transform .2s; }
.tech.open .chev { transform: rotate(90deg); }
.fig { display: block; background: var(--surface-2); border-radius: 12px; }
.fig.mini { width: 56px; height: 43px; border-radius: 10px; }
.fig.big { width: 100%; height: auto; max-height: 260px; }
.fig .near, .fig .body { stroke: var(--accent); stroke-linecap: round; }
.fig .far { stroke: var(--accent); stroke-linecap: round; opacity: .38; }
.fig .headc { fill: var(--accent); }
.fig .eq circle, .fig .eq rect, .fig rect.eq { fill: var(--fg); }
.fig .eq .eq-h { fill: none; stroke: var(--fg); stroke-width: 2.5; }
.fig .eq .plate { fill: var(--surface-3); stroke: var(--fg); stroke-width: 3; }
.fig .prop rect { fill: var(--surface-3); }
.fig .ground { stroke: var(--surface-3); stroke-width: 2; }
.fig .cable { stroke: var(--fg-2); stroke-width: 1.5; }
.fig .pulley { fill: var(--fg-2); }
.techp { display: grid; gap: 10px; }
.techp .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.figcap { font-size: 12px; color: var(--fg-3); text-align: center; margin-top: -4px; }
a.link { text-decoration: none; }
.addex { width: 100%; border: 1.5px dashed var(--surface-3); background: transparent; color: var(--accent); border-radius: var(--r); padding: 16px; font-size: 16px; font-weight: 700; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 0; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; background: var(--surface); color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg .lbl { font-size: 13px; color: var(--fg-3); align-self: center; }
.extra-tag { font-size: 11px; font-weight: 700; color: var(--fg-3); background: var(--surface-2); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: middle; }

/* bottom sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 22px 22px 0 0; max-height: 82vh; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 0 auto 12px; }
.sheet .in { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; color: var(--fg-2); font-size: 15px; }
.sheet h2 { margin: 0; color: var(--fg); font-size: 22px; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.weeks { display: grid; grid-template-columns: repeat(var(--n, 8), 1fr); gap: 4px; }
.weeks i { height: 6px; border-radius: 3px; background: var(--surface-3); }
.weeks i.past { background: var(--accent); opacity: .4; }
.weeks i.now { background: var(--accent); }
.weeks i.deload { background: var(--warn); opacity: .5; }
.weeks i.deload.now { opacity: 1; }

/* tab bar */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: rgba(18,18,20,.86); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border-top: .5px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar); }
nav.tabbar button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--fg-3); font-size: 11px; font-weight: 600; }
nav.tabbar svg { width: 26px; height: 26px; }
nav.tabbar button[aria-selected="true"] { color: var(--accent); }

/* rest timer */
.timer { position: fixed; z-index: 8; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabbar) + 10px + env(safe-area-inset-bottom, 0px)); }
.timer .in { max-width: 536px; margin: 0 auto; background: var(--surface-2); border-radius: 22px; padding: 10px 10px 10px 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.ring { width: 46px; height: 46px; flex: none; }
.ring circle { fill: none; stroke-width: 5; }
.timer .t { font-family: var(--font-num); font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 72px; }
.timer .l { flex: 1; font-size: 12px; color: var(--fg-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.timer button { border: 0; background: var(--surface-3); color: var(--fg); border-radius: 12px; height: 40px; padding: 0 12px; font-weight: 700; font-size: 14px; }
.timer.over .t { color: var(--accent); }
.timer.over .in { box-shadow: 0 0 0 2px var(--accent), 0 10px 30px rgba(0,0,0,.6); }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); background: var(--surface-3); color: var(--fg); padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top"><div class="wrap"><div class="week" id="week"></div></div></header>

<main><div class="wrap" id="view"></div></main>

<div class="timer" id="timer" hidden>
  <div class="in">
    <svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="20" stroke="var(--surface-3)"/><circle id="ring" cx="23" cy="23" r="20" stroke="var(--accent)" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0" transform="rotate(-90 23 23)"/></svg>
    <div class="t" id="timer-t">1:30</div>
    <div class="l" id="timer-l">Pause</div>
    <button id="timer-plus" type="button">+15</button>
    <button id="timer-stop" type="button" aria-label="Pause beenden">✕</button>
  </div>
</div>

<nav class="tabbar" role="tablist"><div class="in">
  <button type="button" role="tab" data-tab="heute" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5a3 3 0 0 1 6 0"/><path d="M8.2 8h7.6a2 2 0 0 1 1.95 1.56l1.6 7.2A2.6 2.6 0 0 1 16.8 20H7.2a2.6 2.6 0 0 1-2.55-3.24l1.6-7.2A2 2 0 0 1 8.2 8Z"/></svg>Training</button>
  <button type="button" role="tab" data-tab="verlauf" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><path d="M15 7h3v3"/></svg>Verlauf</button>
  <button type="button" role="tab" data-tab="plan" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 9.5h16M9 3v4M15 3v4"/></svg>Plan</button>
</div></nav>

<script>
// Animated exercise figures: a side-view body driven by joint angles, interpolated between two key poses.
// Angles in degrees. Arms/legs in "hip" mode: 0 = straight down, +90 = pointing forward (right), 180 = up.
// "foot" mode keeps the feet planted: knee = forward lean of the shin, thigh = how far the hip sits back.
const FIG = (() => {
  const L = { thigh: 40, shin: 38, torso: 46, upper: 27, fore: 25, neck: 11, head: 8.5, foot: 13 };
  const G = 158; // ground line
  const rad = d => d * Math.PI / 180;
  const add = (p, len, ang) => [p[0] + len * Math.sin(rad(ang)), p[1] + len * Math.cos(rad(ang))];   // ang from straight down, + forward
  const up = (p, len, ang) => [p[0] + len * Math.sin(rad(ang)), p[1] - len * Math.cos(rad(ang))];    // ang from straight up, + forward

  function solve(P) {
    const J = {};
    if (P.mode === "foot") {
      J.an = [P.x, G - 3]; J.toe = [P.x + L.foot, G - 2];
      J.kn = up(J.an, L.shin, P.knee || 0);
      J.hip = up(J.kn, L.thigh, -(P.hipBack || 0));
      J.kn2 = [J.kn[0] - 3, J.kn[1]]; J.an2 = [J.an[0] - 3, J.an[1]]; J.toe2 = [J.toe[0] - 3, J.toe[1]];
    } else {
      J.hip = [P.x, P.y];
      J.kn = add(J.hip, L.thigh, P.th ?? 0); J.an = add(J.kn, L.shin, P.sh ?? 0);
      J.kn2 = add(J.hip, L.thigh, P.th2 ?? P.th ?? 0); J.an2 = add(J.kn2, L.shin, P.sh2 ?? P.sh ?? 0);
      const fa = P.footAng ?? 90, fa2 = P.footAng2 ?? P.footAng ?? 90;
      J.toe = add(J.an, L.foot, fa); J.toe2 = add(J.an2, L.foot, fa2);
    }
    const t = P.torso || 0;
    J.sh = up(J.hip, L.torso, t);
    J.neck = up(J.sh, 4, t);
    J.head = up(J.sh, L.neck + L.head - 2, t + (P.headTilt || 0));
    J.el = add(J.sh, L.upper, P.a ?? 0); J.ha = add(J.el, L.fore, P.b ?? P.a ?? 0);
    J.el2 = add(J.sh, L.upper, P.a2 ?? P.a ?? 0); J.ha2 = add(J.el2, L.fore, P.b2 ?? P.b ?? P.a2 ?? P.a ?? 0);
    J.foreAng = P.b ?? P.a ?? 0; J.foreAng2 = P.b2 ?? P.b ?? P.a2 ?? P.a ?? 0;
    return J;
  }
  const lerp = (a, b, k) => a + (b - a) * k;
  function mix(A, B, k) {
    const o = { mode: A.mode };
    for (const key of new Set([...Object.keys(A), ...Object.keys(B)])) {
      if (key === "mode") continue;
      const va = A[key] ?? B[key], vb = B[key] ?? A[key];
      o[key] = typeof va === "number" ? lerp(va, vb, k) : (k < .5 ? va : vb);
    }
    return o;
  }
  const seg = (p, q, cls, w) => `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" class="${cls}" stroke-width="${w}"/>`;
  function kb(p, dirAng = 0, scale = 1) {
    // handle at the hand, bell continues along the forearm direction (or hangs)
    const c = add(p, 11 * scale, dirAng);
    return `<g class="eq"><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${(8.5 * scale).toFixed(1)}"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(4 * scale).toFixed(1)}" class="eq-h"/></g>`;
  }
  function db(p) { return `<g class="eq"><rect x="${(p[0] - 9).toFixed(1)}" y="${(p[1] - 3).toFixed(1)}" width="18" height="6" rx="2"/><rect x="${(p[0] - 11).toFixed(1)}" y="${(p[1] - 6).toFixed(1)}" width="6" height="12" rx="2"/><rect x="${(p[0] + 5).toFixed(1)}" y="${(p[1] - 6).toFixed(1)}" width="6" height="12" rx="2"/></g>`; }
  function draw(def, P) {
    const J = solve(P);
    const eq = def.equip || [];
    let back = "", front = "";
    // static props behind the body
    for (const e of eq) {
      if (e === "bench") back += `<g class="prop"><rect x="44" y="${(P.y + 5).toFixed(1)}" width="104" height="9" rx="3"/><rect x="58" y="${(P.y + 14).toFixed(1)}" width="7" height="${(G - P.y - 14).toFixed(1)}"/><rect x="128" y="${(P.y + 14).toFixed(1)}" width="7" height="${(G - P.y - 14).toFixed(1)}"/></g>`;
      if (e === "seat") back += `<g class="prop"><rect x="${(P.x - 22).toFixed(1)}" y="${(P.y + 6).toFixed(1)}" width="40" height="8" rx="3"/><rect x="${(P.x - 6).toFixed(1)}" y="${(P.y + 14).toFixed(1)}" width="7" height="${(G - P.y - 14).toFixed(1)}"/></g>`;
      if (e === "rowbench") back += `<g class="prop"><rect x="${(J.ha2[0] - 30).toFixed(1)}" y="${(J.ha2[1] + 2).toFixed(1)}" width="62" height="8" rx="3"/><rect x="${(J.ha2[0] - 4).toFixed(1)}" y="${(J.ha2[1] + 10).toFixed(1)}" width="7" height="${(G - J.ha2[1] - 10).toFixed(1)}"/></g>`;
      if (e === "tower") back += `<g class="prop"><rect x="${def.tower[0]}" y="10" width="8" height="${G - 10}" rx="2"/></g>`;
      if (e === "pad") back += `<g class="prop"><rect x="${(J.kn[0] - 8).toFixed(1)}" y="${(J.kn[1] - 12).toFixed(1)}" width="16" height="7" rx="3"/></g>`;
      if (e === "mat") back += `<g class="prop"><rect x="20" y="${G - 4}" width="180" height="4" rx="2"/></g>`;
    }
    // far limbs (dimmer), torso, near limbs
    let body = "";
    body += seg(J.hip, J.kn2, "far", 9) + seg(J.kn2, J.an2, "far", 8) + seg(J.an2, J.toe2, "far", 6);
    body += seg(J.sh, J.el2, "far", 7.5) + seg(J.el2, J.ha2, "far", 6.5);
    body += seg(J.hip, J.sh, "body", 15);
    body += `<circle cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="${L.head}" class="headc"/>`;
    body += seg(J.hip, J.kn, "near", 10) + seg(J.kn, J.an, "near", 9) + seg(J.an, J.toe, "near", 6.5);
    let eqFar = "", eqNear = "";
    for (const e of eq) {
      if (e === "kb") eqNear += kb(J.ha, P.kbAng ?? 0);
      if (e === "kb2") eqFar += kb(J.ha2, P.kbAng ?? 0, .95);
      if (e === "kbFwd") eqNear += kb(J.ha, J.foreAng);
      if (e === "kbRack") eqNear += kb(J.ha, (P.kbAng ?? 200));
      if (e === "goblet") eqNear += `<g class="eq"><circle cx="${(J.ha[0] + 4).toFixed(1)}" cy="${(J.ha[1] + 9).toFixed(1)}" r="9"/></g>`;
      if (e === "db") eqNear += db(J.ha);
      if (e === "db2") eqFar += db(J.ha2);
      if (e === "trap") { const y = J.ha[1]; eqNear += `<g class="eq"><rect x="${(J.ha[0] - 30).toFixed(1)}" y="${(y - 2).toFixed(1)}" width="60" height="4" rx="2"/><circle cx="${(J.ha[0] - 22).toFixed(1)}" cy="${y.toFixed(1)}" r="16" class="plate"/><circle cx="${(J.ha[0] + 22).toFixed(1)}" cy="${y.toFixed(1)}" r="16" class="plate"/></g>`; }
      if (e === "cable") { const a = def.anchor; front += `<line x1="${a[0]}" y1="${a[1]}" x2="${J.ha[0].toFixed(1)}" y2="${J.ha[1].toFixed(1)}" class="cable"/><circle cx="${a[0]}" cy="${a[1]}" r="4" class="pulley"/>`; eqNear += `<rect x="${(J.ha[0] - 4).toFixed(1)}" y="${(J.ha[1] - 4).toFixed(1)}" width="8" height="8" rx="2" class="eq"/>`; }
      if (e === "latbar") { const a = def.anchor; front += `<line x1="${a[0]}" y1="${a[1]}" x2="${J.ha[0].toFixed(1)}" y2="${(J.ha[1] - 2).toFixed(1)}" class="cable"/><circle cx="${a[0]}" cy="${a[1]}" r="4" class="pulley"/>`; eqNear += `<rect x="${(J.ha[0] - 22).toFixed(1)}" y="${(J.ha[1] - 2.5).toFixed(1)}" width="44" height="5" rx="2.5" class="eq"/>`; }
    }
    const arms = seg(J.sh, J.el, "near", 8.5) + seg(J.el, J.ha, "near", 7.5);
    return `<line x1="8" y1="${G}" x2="212" y2="${G}" class="ground"/>${back}${front}${eqFar}${body}${arms}${eqNear}`;
  }

  // ---- the moves ----
  const stand = { mode: "foot", x: 108, knee: 0, hipBack: 0, torso: 0, a: 0, b: 0 };
  const walkA = { mode: "hip", x: 108, y: 79, th: 18, sh: 8, th2: -16, sh2: -2, torso: 0, a: 4, b: 4, a2: 4, b2: 4, footAng: 85, footAng2: 95 };
  const walkB = { mode: "hip", x: 108, y: 79, th: -16, sh: -2, th2: 18, sh2: 8, torso: 0, a: 4, b: 4, a2: 4, b2: 4, footAng: 95, footAng2: 85 };
  const D = {
    swing: { label: "Kettlebell Swing", equip: ["kbFwd"], frames: [
      { ...stand, x: 96, knee: 14, hipBack: 30, torso: 72, a: -28, b: -34, headTilt: -25 },
      { ...stand, x: 96, torso: -4, a: 92, b: 92 }] },
    kbdl: { label: "Kettlebell Deadlift", equip: ["kb"], frames: [
      { ...stand, x: 100, knee: 22, hipBack: 48, torso: 58, a: 0, b: 0, headTilt: -20 },
      { ...stand, x: 100 }] },
    goblet: { label: "Goblet Squat", equip: ["goblet"], frames: [
      { ...stand, x: 104, a: 22, b: 168 },
      { ...stand, x: 104, knee: 38, hipBack: 92, torso: 34, a: 40, b: 186, headTilt: -24 }] },
    rdl: { label: "Romanian Deadlift", equip: ["kb"], frames: [
      { ...stand, x: 100 },
      { ...stand, x: 100, knee: 10, hipBack: 26, torso: 74, a: 0, b: 0, headTilt: -24 }] },
    bench: { label: "Kurzhantel-Bankdrücken", equip: ["bench", "db"], frames: [
      { mode: "hip", x: 72, y: 104, th: -72, sh: -8, torso: 90, a: 30, b: 176, footAng: 90 },
      { mode: "hip", x: 72, y: 104, th: -72, sh: -8, torso: 90, a: 180, b: 180, footAng: 90 }] },
    row: { label: "Einarmiges Rudern", equip: ["rowbench", "kb"], frames: [
      { ...stand, x: 88, knee: 14, hipBack: 30, torso: 72, a: 0, b: 0, a2: 48, b2: 40, headTilt: -20 },
      { ...stand, x: 88, knee: 14, hipBack: 30, torso: 72, a: -72, b: 0, a2: 48, b2: 40, headTilt: -20 }] },
    farmer: { label: "Farmer's Carry", equip: ["kb", "kb2"], walk: true, frames: [walkA, walkB] },
    suitcase: { label: "Suitcase Carry", equip: ["kb"], walk: true, frames: [walkA, walkB] },
    lunge: { label: "Reverse Lunge", equip: ["db"], frames: [
      { mode: "hip", x: 104, y: 79, th: 0, sh: 0, th2: 0, sh2: 0, torso: 0, a: 0, b: 0, footAng: 90, footAng2: 90 },
      { mode: "hip", x: 104, y: 118, th: 82, sh: -4, th2: -22, sh2: -82, torso: 6, a: 0, b: 0, footAng: 90, footAng2: 180 }] },
    hkpress: { label: "Halb kniende Overhead Press", equip: ["kbRack"], frames: [
      { mode: "hip", x: 100, y: 116, th: 0, sh: -90, th2: 88, sh2: 0, footAng: 180, footAng2: 90, torso: 0, a: 6, b: 148, kbAng: 262 },
      { mode: "hip", x: 100, y: 116, th: 0, sh: -90, th2: 88, sh2: 0, footAng: 180, footAng2: 90, torso: 0, a: 178, b: 180, kbAng: 262 }] },
    latpull: { label: "Latzug", equip: ["seat", "pad", "latbar"], anchor: [118, 8], frames: [
      { mode: "hip", x: 100, y: 108, th: 88, sh: 4, torso: -8, a: 168, b: 172, footAng: 90 },
      { mode: "hip", x: 100, y: 108, th: 88, sh: 4, torso: -14, a: 22, b: 168, footAng: 90 }] },
    pallof: { label: "Pallof Press", equip: ["tower", "cable"], tower: 18, anchor: [22, 64], frames: [
      { mode: "hip", x: 112, y: 80, th: 6, sh: 0, th2: -6, sh2: 0, torso: 0, a: 28, b: 128, footAng: 90 },
      { mode: "hip", x: 112, y: 80, th: 6, sh: 0, th2: -6, sh2: 0, torso: 0, a: 90, b: 90, footAng: 90 }] },
    clean: { label: "Kettlebell Clean", equip: ["kbRack"], frames: [
      { ...stand, x: 98, knee: 18, hipBack: 40, torso: 56, a: -8, b: -8, kbAng: 0, headTilt: -20 },
      { ...stand, x: 98, a: 6, b: 148, kbAng: 262 }] },
    trapbar: { label: "Trap-Bar Deadlift", equip: ["trap"], frames: [
      { ...stand, x: 104, knee: 30, hipBack: 62, torso: 44, a: 0, b: 0, headTilt: -16 },
      { ...stand, x: 104 }] },
    pushup: { label: "Liegestütze", equip: ["mat"], frames: [
      { mode: "hip", x: 98, y: 106, th: -78, sh: -78, torso: 78, a: 4, b: 2, footAng: 0 },
      { mode: "hip", x: 98, y: 132, th: -84, sh: -84, torso: 86, a: -64, b: 26, footAng: 0 }] },
    cablerow: { label: "Sitzendes Kabelrudern", equip: ["cable"], anchor: [200, 132], frames: [
      { mode: "hip", x: 78, y: 140, th: 84, sh: 62, torso: 16, a: 82, b: 86, footAng: 170 },
      { mode: "hip", x: 78, y: 140, th: 84, sh: 62, torso: -4, a: -32, b: 82, footAng: 170 }] },
  };
  return { D, draw, mix };
})();

(() => {
  const DEFAULT_PLAN = {"example":false,"program":{"start":"2026-10-26","weeks":8,"phases":[{"from":1,"to":2,"title":"Technik und Einstieg","text":"Bei den meisten Übungen 2–3 Sätze. Leichte Gewichte, saubere Wiederholungen, keine Sätze bis zum Muskelversagen. Swings und Cleans nur mit sicherer Technik."},{"from":3,"to":4,"title":"Volumen festigen","text":"Arbeite dich auf die angegebenen Sätze hoch. Ergänze Wiederholungen, solange Technik und Bewegungstempo kontrolliert bleiben."},{"from":5,"to":6,"title":"Gezielt steigern","text":"Erreichst du bei allen Sätzen das obere Ende des Wiederholungsbereichs mit etwa 2–3 Wiederholungen Reserve, erhöhe das Gewicht um die kleinste verfügbare Stufe und starte wieder am unteren Ende."},{"from":7,"to":7,"title":"Stabile Belastung","hold":true,"text":"Halte die erreichten Gewichte und verbessere die Bewegungsqualität. Bei Swings und Cleans zählen Explosivität und Kontrolle, nicht eine immer schwerere Kettlebell."},{"from":8,"to":8,"title":"Entlastungswoche","deload":true,"text":"Reduziere die Satzzahl um etwa ein Drittel bis die Hälfte. Nutze die Woche zur Erholung und prüfe, welche Gewichte und Übungen du künftig steigern kannst."}]},"rules":["Gewichte: Die letzten Wiederholungen sollen fordernd, aber technisch sauber sein. Kettlebell-Gewichte nach Technik wählen, nicht nach einem festen kg-Ziel.","Pausen sind Richtwerte. Wenn du noch deutlich außer Atem bist oder die Technik leidet, pausiere länger.","Swings und Cleans sind Technikübungen, keine Ausdauer-Challenge. Beende den Satz, sobald die Bewegung unsauber wird.","Beweglichkeit: Nach dem Training bei Bedarf 5 Minuten für Hüfte, Sprunggelenke und Brustwirbelsäule.","Sind die Beine am Samstag vom Freitag noch schwer, nimm beim Cardio lieber das Rad oder verkürze die Einheit.","In den ersten 4 Wochen keine harten Sprintintervalle oder intensiven Kettlebell-Finisher.","Halte den Plan mindestens 8 Wochen weitgehend konstant. Fortschritt kommt durch bessere Technik und kontrolliert höhere Belastung."],"days":[{"id":"fb-a","name":"Full Body A","kind":"kraft","weekday":0,"focus":"Kraftbasis und Explosivität","duration":"50–60 Min.","note":"Schwerpunkt: Beine, Hüfte, Drücken und Ziehen.","exercises":[{"id":"kb-swing","name":"Kettlebell Swing","sets":3,"repsMin":10,"repsMax":10,"unit":"Wdh","load":"kg","perSide":false,"restSec":60,"restMax":90,"step":4,"note":"Technik zuerst. Explosive Hüftstreckung, hintere Kette. Hüftknick zunächst mit leichter Kettlebell lernen.","alt":"Kettlebell Deadlift, 3 × 10.","anim":"swing","altAnim":"kbdl"},{"id":"goblet","name":"Goblet Squat","sets":3,"repsMin":8,"repsMax":10,"unit":"Wdh","load":"kg","perSide":false,"restSec":90,"restMax":null,"step":4,"note":"Kettlebell vor der Brust. Kontrollierte Bewegung, stabiler Rumpf.","anim":"goblet"},{"id":"kh-bank","name":"Kurzhantel-Bankdrücken","sets":3,"repsMin":8,"repsMax":10,"unit":"Wdh","load":"kg","perSide":false,"restSec":90,"restMax":120,"step":2,"note":"Gewicht pro Hand eintragen. Brust, Schultern, Trizeps.","anim":"bench"},{"id":"kb-row","name":"Einarmiges Kettlebell-Rudern","sets":3,"repsMin":10,"repsMax":10,"unit":"Wdh","load":"kg","perSide":true,"restSec":60,"restMax":90,"step":4,"note":"Ellenbogen zur Hüfte ziehen, Oberkörper nicht verdrehen.","anim":"row"},{"id":"farmer","name":"Farmer's Carry","sets":3,"repsMin":30,"repsMax":40,"unit":"m","load":"kg","perSide":false,"restSec":60,"restMax":null,"step":4,"note":"Zwei Kettlebells oder Kurzhanteln, Gewicht pro Hand. Griffkraft, Rumpf, Körperkontrolle.","anim":"farmer"}]},{"id":"cardio-1","name":"Cardio 1","kind":"cardio","weekday":1,"focus":"Grundlagenausdauer","duration":"30–40 Min.","note":"Laufen oder Radfahren in einem Tempo, in dem du dich noch in ganzen Sätzen unterhalten kannst. Baut Ausdauer auf, ohne das Krafttraining zu stark zu belasten.","exercises":[{"id":"ga-lauf","name":"Lockerer Lauf oder Rad","sets":1,"repsMin":30,"repsMax":40,"unit":"Min","load":"km","perSide":false,"restSec":60,"restMax":null,"step":1,"note":"Minuten und optional Kilometer eintragen. Laufen oder Rad in den Notizen festhalten."}]},{"id":"fb-b","name":"Full Body B","kind":"kraft","weekday":2,"focus":"Einseitige Kraft, Oberkörper und Stabilität","duration":"50–60 Min.","note":"Schwerpunkt: Gleichgewicht, Beine, Schultern und Rumpf.","exercises":[{"id":"rev-lunge","name":"Reverse Lunge mit Kurzhanteln","sets":3,"repsMin":8,"repsMax":8,"unit":"Wdh","load":"kg","perSide":true,"restSec":90,"restMax":null,"step":2,"note":"Einseitige Beinkraft und Kontrolle. Erst mit Körpergewicht (0 kg), dann mit Zusatzgewicht, wenn du stabil bleibst.","anim":"lunge"},{"id":"kb-rdl","name":"Kettlebell Romanian Deadlift","sets":3,"repsMin":10,"repsMax":10,"unit":"Wdh","load":"kg","perSide":false,"restSec":90,"restMax":null,"step":4,"note":"Hüfte nach hinten schieben, Gewichte nah am Körper. Dehnung hinten im Oberschenkel spüren.","anim":"rdl"},{"id":"hk-press","name":"Halb kniender Kettlebell Overhead Press","sets":3,"repsMin":6,"repsMax":8,"unit":"Wdh","load":"kg","perSide":true,"restSec":60,"restMax":90,"step":2,"note":"Kontrolliert über Kopf drücken, nicht ins Hohlkreuz ausweichen.","alt":"Zunächst mit einer Kurzhantel üben.","anim":"hkpress"},{"id":"latzug","name":"Latzug","sets":3,"repsMin":8,"repsMax":12,"unit":"Wdh","load":"kg","perSide":false,"restSec":90,"restMax":null,"step":2.5,"note":"Vertikale Zugbewegung für Rücken und Arme.","anim":"latpull"},{"id":"pallof","name":"Pallof Press am Kabelzug","sets":3,"repsMin":10,"repsMax":10,"unit":"Wdh","load":"kg","perSide":true,"restSec":45,"restMax":60,"step":2.5,"note":"Oberkörper ruhig halten, Kabel nach vorne drücken. Anti-Rotation.","anim":"pallof"}]},{"id":"erholung","name":"Erholung","kind":"erholung","weekday":3,"focus":"Aktive Regeneration","duration":"10–15 Min.","note":"Spaziergang oder 10–15 Minuten Mobility für Hüfte, Sprunggelenke und Brustwirbelsäule.","exercises":[{"id":"mobility","name":"Spaziergang oder Mobility","sets":1,"repsMin":10,"repsMax":15,"unit":"Min","load":"none","perSide":false,"restSec":60,"restMax":null,"step":1,"note":""}]},{"id":"fb-c","name":"Full Body C","kind":"kraft","weekday":4,"focus":"Ganzkörper, Power und Conditioning","duration":"45–60 Min.","note":"Schwerpunkt: Kraft, Power und kontrollierte Belastbarkeit.","exercises":[{"id":"kb-clean","name":"Kettlebell Clean zur Rack-Position","sets":3,"repsMin":5,"repsMax":5,"unit":"Wdh","load":"kg","perSide":true,"restSec":60,"restMax":90,"step":4,"note":"Erst den Clean ohne anschließendes Drücken üben. Die Kettlebell soll kontrolliert in die Rack-Position kommen, nicht auf den Unterarm schlagen.","alt":"Kettlebell Deadlift, 3 × 10.","anim":"clean","altAnim":"kbdl"},{"id":"trapbar","name":"Trap-Bar Deadlift","sets":3,"repsMin":5,"repsMax":5,"unit":"Wdh","load":"kg","perSide":false,"restSec":120,"restMax":null,"step":5,"note":"Moderates Gewicht. Jeden Satz mit sauberer Technik und etwas Reserve beenden.","anim":"trapbar"},{"id":"liegestuetz","name":"Liegestütze","sets":3,"repsMin":8,"repsMax":15,"unit":"Wdh","load":"none","perSide":false,"restSec":60,"restMax":90,"step":1,"note":"Körper und Rumpf stabil. Wenn 15 Wiederholungen leicht sind, die Variante schrittweise erschweren (Variante in den Notizen festhalten).","anim":"pushup"},{"id":"kabelrudern","name":"Sitzendes Kabelrudern","sets":3,"repsMin":10,"repsMax":12,"unit":"Wdh","load":"kg","perSide":false,"restSec":75,"restMax":90,"step":2.5,"note":"Kontrolliert ziehen, kein Schwung aus dem Oberkörper.","anim":"cablerow"},{"id":"suitcase","name":"Suitcase Carry","sets":3,"repsMin":30,"repsMax":30,"unit":"m","load":"kg","perSide":true,"restSec":45,"restMax":60,"step":4,"note":"Eine Kettlebell nur auf einer Seite. Aufrecht bleiben, nicht zur Last kippen.","anim":"suitcase"}]},{"id":"cardio-2","name":"Cardio 2","kind":"cardio","weekday":5,"focus":"Längere Ausdauereinheit","duration":"40–60 Min.","note":"Radfahren, lockeres Laufen oder eine andere Ausdaueraktivität, überwiegend moderat. Wenn du müde bist, Dauer oder Intensität reduzieren.","exercises":[{"id":"ga-lang","name":"Rad oder lockerer Lauf","sets":1,"repsMin":40,"repsMax":60,"unit":"Min","load":"km","perSide":false,"restSec":60,"restMax":null,"step":1,"note":"Minuten und optional Kilometer eintragen."}]}]};
  const STORE_KEY = "eisenbuch:v1";
  const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  const WD_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
  const UNITS = { Wdh: "Wiederholungen", m: "Meter", Min: "Minuten", s: "Sekunden" };
  const LOADS = { kg: "Gewicht (kg)", km: "Strecke (km)", none: "Ohne" };
  const KINDS = { kraft: "Kraft", cardio: "Cardio", erholung: "Erholung" };
  const KIND_CLASS = { kraft: "kind-k", cardio: "kind-c", erholung: "kind-e" };

  // ---------- storage (on this device) ----------
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.plan) return d; } } catch {}
    return { v: 1, plan: clone(DEFAULT_PLAN || { days: [] }), sessions: {} };
  }
  const DB = load();
  let saveT = null;
  function persist() {
    clearTimeout(saveT); saveT = null;
    const out = { v: 1, plan: DB.plan, sessions: {} };
    for (const [id, s] of Object.entries(DB.sessions)) if (isMeaningful(s)) out.sessions[id] = s;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(out)); }
    catch { toast("Speichern fehlgeschlagen: Speicher voll oder gesperrt"); }
  }
  function saveSoon() { clearTimeout(saveT); saveT = setTimeout(persist, 250); }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveT) persist(); });
  window.addEventListener("pagehide", () => { if (saveT) persist(); });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  const pref = {
    get(k) { try { return JSON.parse(localStorage.getItem("eisenbuch:pref:" + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("eisenbuch:pref:" + k, JSON.stringify(v)); } catch {} },
  };

  const S = { tab: "heute", selDate: isoDate(new Date()), override: {}, histEx: null, nav: [], openNotes: {}, altShown: {}, confirm: null, sheet: null };
  const FREE = { id: "frei", name: "Freies Training", kind: "kraft", focus: "Eigene Übungen", duration: "", exercises: [] };

  // ---------- helpers ----------
  function isoDate(d) { const z = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }
  function parseIso(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function wdIndex(d) { return (d.getDay() + 6) % 7; }
  function mondayOf(d) { const m = new Date(d); m.setDate(m.getDate() - wdIndex(m)); return m; }
  function fmtShort(s) { const d = parseIso(s); return d.getDate() + "." + (d.getMonth() + 1) + "."; }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function num(v) { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
  function fmt(n) { return n == null ? "–" : (Math.round(n * 100) / 100).toLocaleString("de-DE"); }
  function e1rm(w, r) { if (!w || !r) return 0; return r === 1 ? w : w * (1 + r / 30); } // Epley
  function key(name) { return String(name || "").trim().toLowerCase(); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function range(a, b) { return b != null && b !== a ? `${a}–${b}` : `${a ?? "?"}`; }
  let toastT;
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

  // exercise accessors (older data may lack unit/load)
  const U = ex => ex.unit || "Wdh";
  const LD = ex => ex.load || "kg";
  const strength = ex => LD(ex) === "kg" && U(ex) === "Wdh";
  const isKraft = day => !day.kind || day.kind === "kraft";
  function unitShort(ex) { return U(ex) === "Wdh" ? "" : " " + U(ex); }
  function restText(ex) { const a = ex.restSec || 90, b = ex.restMax; return b && b > a ? `${a}–${b} s` : (a >= 120 && a % 60 === 0 ? `${a / 60} min` : `${a} s`); }
  function setText(ex, s) {
    const l = LD(ex), u = U(ex);
    if (l === "kg" && s.w != null) return u === "Wdh" ? `${fmt(s.w)}×${fmt(s.r)}` : `${fmt(s.w)} kg × ${fmt(s.r)} ${u}`;
    if (l === "km") return `${fmt(s.r)} min${s.w != null ? " · " + fmt(s.w) + " km" : ""}`;
    return `${fmt(s.r)} ${u === "Wdh" ? "Wdh" : u}`;
  }

  // ---------- plan lookup ----------
  const days = () => (DB.plan && Array.isArray(DB.plan.days)) ? DB.plan.days : [];
  const dayIndex = id => days().findIndex(d => d.id === id);
  function sessionsList() { return Object.entries(DB.sessions).map(([id, s]) => ({ id, ...s })).sort((a, b) => b.date.localeCompare(a.date)); }
  const dayById = id => id === FREE.id ? FREE : days().find(d => d.id === id) || null;
  const plannedFor = ds => days().find(d => d.weekday === wdIndex(parseIso(ds))) || null;
  // what is shown for a date: manual choice, else something already logged, else the weekday schedule
  function dayForDate(ds) {
    if (S.override[ds] === "__none") return null;
    if (S.override[ds]) return dayById(S.override[ds]);
    const logged = Object.values(DB.sessions).filter(s => s.date === ds && isMeaningful(s)).sort((a, b) => (b.touched || "").localeCompare(a.touched || ""));
    for (const l of logged) { const d = dayById(l.dayId); if (d) return d; }
    return plannedFor(ds);
  }
  function loggedDays(ds) { return [...new Set(Object.values(DB.sessions).filter(s => s.date === ds && isMeaningful(s)).map(s => s.dayId))].map(dayById).filter(Boolean); }
  function planExByName(name) { const k = key(name); for (const d of days()) for (const e of d.exercises || []) if (key(e.name) === k) return e; return null; }
  function programWeek(ds) {
    const p = DB.plan && DB.plan.program; if (!p || !p.start) return null;
    const week = Math.floor((mondayOf(parseIso(ds)) - mondayOf(parseIso(p.start))) / (7 * 864e5)) + 1;
    return { week, weeks: p.weeks || 8, phase: (p.phases || []).find(ph => week >= ph.from && week <= ph.to) || null, program: p };
  }
  function lastFor(name, before) {
    const k = key(name);
    for (const s of sessionsList()) {
      if (s.date >= before) continue;
      const e = (s.entries || []).find(x => key(x.name) === k);
      if (e) { const sets = e.sets.filter(x => x.done && x.r != null); if (sets.length) return { date: s.date, sets }; }
    }
    return null;
  }
  function setScore(ex, s) { if (!s.done) return 0; if (strength(ex)) return e1rm(s.w, s.r); if (LD(ex) === "kg") return s.w || 0; return s.r || 0; }
  function metricLabel(ex) { if (strength(ex)) return "Geschätztes 1RM · kg"; if (LD(ex) === "kg") return "Top-Gewicht · kg"; if (LD(ex) === "km") return "Dauer · min"; return "Beste Serie · " + U(ex); }
  function bestScore(ex, before) {
    const k = key(ex.name); let best = 0;
    for (const s of Object.values(DB.sessions)) {
      if (before && s.date >= before) continue;
      const e = (s.entries || []).find(x => key(x.name) === k);
      if (e) for (const st of e.sets) best = Math.max(best, setScore(ex, st));
    }
    return best;
  }
  // double progression: every set at the top of the range -> next step up
  function suggestion(ex, last) {
    if (!last || LD(ex) === "km") return null;
    const max = ex.repsMax ?? ex.repsMin ?? 0;
    const allTop = max && last.sets.length >= (ex.sets || 1) && last.sets.every(s => (s.r || 0) >= max);
    if (LD(ex) === "none") return allTop ? { harder: true } : { r: Math.min(max || 99, Math.max(...last.sets.map(s => s.r || 0)) + (U(ex) === "Wdh" ? 1 : 0)) };
    const ws = last.sets.filter(s => s.w != null); if (!ws.length) return null;
    const top = Math.max(...ws.map(s => s.w));
    if (allTop) return { w: top + (ex.step || 2.5), up: true, r: ex.repsMin };
    const topSets = ws.filter(s => s.w === top);
    return { w: top, r: U(ex) === "Wdh" ? Math.min(max || 99, Math.max(...topSets.map(s => s.r)) + 1) : max };
  }

  // ---------- exercise figures ----------
  const GUESS = [[/swing/, "swing"], [/goblet|kniebeug|squat/, "goblet"], [/bankdr|bench/, "bench"], [/kabel.*ruder|cable row/, "cablerow"], [/ruder|row/, "row"],
    [/farmer/, "farmer"], [/suitcase/, "suitcase"], [/lunge|ausfallschritt/, "lunge"], [/rumän|rdl|romanian/, "rdl"], [/trap/, "trapbar"],
    [/kettlebell.*(deadlift|kreuzheb)/, "kbdl"], [/kreuzheb|deadlift/, "trapbar"], [/overhead|schulterdr|press über|military/, "hkpress"],
    [/latzug|pulldown|klimmz/, "latpull"], [/pallof/, "pallof"], [/clean|umsetzen/, "clean"], [/liegest|push.?up/, "pushup"]];
  function animFor(ex) {
    if (typeof FIG === "undefined") return null;
    if (ex.anim === "none") return null;
    if (ex.anim && FIG.D[ex.anim]) return ex.anim;
    const n = key(ex.name); for (const [re, k] of GUESS) if (re.test(n)) return k;
    return null;
  }
  function figSvg(k, frame, cls, live) {
    const d = FIG.D[k];
    return `<svg class="fig ${cls}" viewBox="0 0 220 170" aria-hidden="true"${live ? ` data-anim="${k}"` : ""}>${FIG.draw(d, d.frames[frame])}</svg>`;
  }
  function techPanel(ex) {
    const open = !!S.openNotes[ex.id];
    const base = animFor(ex), alt = ex.altAnim && FIG.D[ex.altAnim] ? ex.altAnim : null;
    const k = S.altShown[ex.id] && alt ? alt : base;
    const video = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + " Technik")}`;
    const head = `<button type="button" class="tech ${open ? "open" : ""}" data-act="note" data-ex="${esc(ex.id)}" aria-expanded="${open}">
      ${base ? figSvg(base, 1, "mini") : ""}<span class="tx">${esc(ex.note || "Technik ansehen")}</span><span class="chev">›</span></button>`;
    if (!open) return head;
    return `<div class="techp">${head}
      ${k ? figSvg(k, 0, "big", true) + `<div class="figcap">${esc(FIG.D[k].label)}${k === alt ? " (Einstiegsvariante)" : ""}</div>` : ""}
      ${ex.alt ? `<div class="alt">Technik sitzt noch nicht? ${esc(ex.alt)}${alt ? ` <button class="link" type="button" data-act="alt-anim" data-ex="${esc(ex.id)}" style="padding:0 0 0 4px">${S.altShown[ex.id] ? "Hauptübung zeigen" : "Zeigen"}</button>` : ""}</div>` : ""}
      <div class="row"><a class="link" href="${video}" target="_blank" rel="noopener">Video-Anleitung ansehen ↗</a></div></div>`;
  }
  let animRAF = null, animLast = 0;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function animate(ts) {
    animRAF = null;
    const figs = document.querySelectorAll("svg[data-anim]");
    if (!figs.length || typeof FIG === "undefined") return;
    if (ts - animLast > 33) {
      animLast = ts;
      const period = 2600, ph = (ts % period) / period;
      // ease in-out ping-pong with a short hold at both ends
      const tri = ph < .5 ? ph * 2 : 2 - ph * 2;
      const hold = Math.min(1, Math.max(0, (tri - .1) / .8));
      const k = reduceMotion ? 1 : hold * hold * (3 - 2 * hold);
      figs.forEach(svg => { const d = FIG.D[svg.dataset.anim]; svg.innerHTML = FIG.draw(d, FIG.mix(d.frames[0], d.frames[1], k)); });
    }
    animRAF = requestAnimationFrame(animate);
  }
  function startAnim() { if (!animRAF) animRAF = requestAnimationFrame(animate); }

  // ---------- sessions ----------
  function isMeaningful(s) { return !!(s && (s.finishedAt || s.notes || (s.entries || []).some(e => e.sets.some(x => x.done || x.w != null || x.r != null)))); }
  function getSession(ds, day) {
    const id = ds + "_" + day.id;
    if (!DB.sessions[id]) DB.sessions[id] = { date: ds, dayId: day.id, dayName: day.name, entries: [], notes: "", finishedAt: null };
    const s = DB.sessions[id];
    const pw = programWeek(ds), deload = pw && pw.phase && pw.phase.deload;
    for (const ex of exList(day, s)) {
      let e = s.entries.find(x => x.exId === ex.id) || s.entries.find(x => key(x.name) === key(ex.name));
      if (!e) {
        e = { exId: ex.id, name: ex.name, unit: U(ex), load: LD(ex), sets: [] }; s.entries.push(e);
        const n = deload && isKraft(day) ? Math.max(1, Math.round((ex.sets || 1) * 0.6)) : (ex.sets || 1);
        for (let i = 0; i < n; i++) e.sets.push({ w: null, r: null, done: false });
      }
      if (!e.sets.length) e.sets.push({ w: null, r: null, done: false });
    }
    return { id, s };
  }
  function exList(day, s) { return [...(day.exercises || []), ...((s && s.extras) || [])]; }
  function touch(s) { s.touched = new Date().toISOString(); }
  function entryOf(s, ex) { return s.entries.find(x => x.exId === ex.id) || s.entries.find(x => key(x.name) === key(ex.name)); }

  // ---------- render ----------
  function render() {
    document.querySelectorAll("nav.tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
    document.querySelector("header.top").hidden = S.tab !== "heute";
    renderWeek();
    const v = document.getElementById("view");
    v.innerHTML = S.tab === "heute" ? renderToday() : S.tab === "verlauf" ? renderHistory() : renderPlan();
    if (S.tab === "verlauf") wireChart();
    renderSheet();
    startAnim();
  }
  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

  function renderWeek() {
    const mon = mondayOf(parseIso(S.selDate)), today = isoDate(new Date());
    const logged = new Set(Object.values(DB.sessions).filter(s => (s.entries || []).some(e => e.sets.some(x => x.done))).map(s => s.date));
    let h = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      const ds = isoDate(d), day = days().find(x => x.weekday === i);
      h += `<button type="button" data-date="${ds}" aria-pressed="${ds === S.selDate}" class="${ds === today ? "today" : ""} ${day ? KIND_CLASS[day.kind || "kraft"] : ""}" aria-label="${WD_LONG[i]} ${fmtShort(ds)}${day ? ", " + esc(day.name) : ""}">
        <span class="wd">${WD[i]}</span><span class="dn">${d.getDate()}</span><span class="dot ${logged.has(ds) ? "done" : ""}"></span></button>`;
    }
    document.getElementById("week").innerHTML = h;
  }

  function installHint() {
    const inFrame = (() => { try { return window.top !== window; } catch { return true; } })();
    const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    if (inFrame || standalone || pref.get("hintDone")) return "";
    return `<div class="hint"><div class="row"><b>Als App installieren</b><button class="link muted" type="button" data-act="hint-done">Ausblenden</button></div>
      <div>In Safari unten auf <b>Teilen</b> tippen, dann <b>„Zum Home-Bildschirm“</b>. Danach startet Eisenbuch wie eine App, auch ohne Internet.</div></div>`;
  }

  function renderToday() {
    const ds = S.selDate, d = parseIso(ds);
    const dateLabel = WD_LONG[wdIndex(d)] + " · " + d.toLocaleDateString("de-DE", { day: "numeric", month: "short" });
    const day = dayForDate(ds);
    const pw = programWeek(ds);
    const phasePill = pw ? `<button class="pill phase" type="button" data-act="open-phase">${pw.week < 1 ? "Start " + fmtShort(pw.program.start) : pw.week > pw.weeks ? "Block beendet" : `<b class="num">W${pw.week}</b> ${esc(pw.phase ? pw.phase.title : "")}`}<span class="chev">›</span></button>` : "";
    const switcher = `<button class="pill" type="button" data-act="open-switch">Andere Einheit<span class="chev">›</span></button>`;
    const onDate = loggedDays(ds);
    if (day && !onDate.some(x => x.id === day.id)) onDate.push(day);
    const seg = onDate.length > 1 ? `<div class="seg"><span class="lbl">An diesem Tag:</span>${onDate.map(x => `<button type="button" data-act="pick-unit" data-id="${esc(x.id)}" aria-pressed="${day && x.id === day.id}">${esc(x.name)}</button>`).join("")}</div>` : "";
    const pills = `<div class="pills">${phasePill}${switcher}</div>${seg}`;

    if (!days().length) return `<div class="head"><div class="eyebrow">${dateLabel}</div><h1 class="title">Kein Plan</h1></div>${installHint()}
      <div class="empty"><h3>Noch keine Einheiten</h3><div>Lege im Tab Plan deine Einheiten an.</div></div>`;

    if (!day) {
      let next = null; const wd = wdIndex(d);
      for (let k = 1; k <= 7 && !next; k++) { const w = (wd + k) % 7; const x = days().find(y => y.weekday === w); if (x) next = { x, w }; }
      return `<div class="head"><div class="eyebrow">${dateLabel}</div><h1 class="title">Ruhetag</h1>
        ${next ? `<div class="sub">Als Nächstes: ${esc(next.x.name)} am ${WD_LONG[next.w]}</div>` : ""}</div>
        ${installHint()}${pills}
        <div class="empty"><h3>Regeneration</h3><div>Dein Körper passt sich in der Pause an. Wenn du trotzdem trainieren willst, tippe auf „Andere Einheit“.</div></div>`;
    }

    const { id, s } = getSession(ds, day);
    let total = 0, done = 0, vol = 0, mins = 0;
    const extras = s.extras || [];
    const cards = exList(day, s).map((ex, n) => {
      const isExtra = extras.includes(ex);
      const e = entryOf(s, ex), l = LD(ex), u = U(ex), hasLoad = l !== "none";
      const last = lastFor(ex.name, ds), sug = suggestion(ex, last), prev = bestScore(ex, ds);
      let best = 0;
      const rows = e.sets.map((st, i) => {
        total++;
        if (st.done) { done++; if (strength(ex)) vol += (st.w || 0) * (st.r || 0) * (ex.perSide ? 2 : 1); if (u === "Min") mins += st.r || 0; best = Math.max(best, setScore(ex, st)); }
        const lp = last && last.sets[Math.min(i, last.sets.length - 1)];
        const prevW = i > 0 ? e.sets[i - 1].w : null;
        const phW = l === "kg" ? (prevW != null ? fmt(prevW) : sug && sug.w != null ? fmt(sug.w) : (lp && lp.w != null ? fmt(lp.w) : "kg")) : (lp && lp.w != null ? fmt(lp.w) : "km");
        const phR = sug && sug.r ? sug.r : (ex.repsMin ?? "");
        const wIn = hasLoad ? `<input id="w-${id}-${ex.id}-${i}" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="${l} Satz ${i + 1}" placeholder="${phW}" value="${st.w != null ? fmt(st.w) : ""}" data-act="set-w" data-ex="${esc(ex.id)}" data-i="${i}">` : "";
        const rIn = `<input id="r-${id}-${ex.id}-${i}" inputmode="${u === "Wdh" ? "numeric" : "decimal"}" enterkeyhint="done" autocomplete="off" aria-label="${UNITS[u]} Satz ${i + 1}" placeholder="${phR}" value="${st.r != null ? fmt(st.r) : ""}" data-act="set-r" data-ex="${esc(ex.id)}" data-i="${i}">`;
        return `<div class="srow ${hasLoad ? "" : "one"} ${st.done ? "done" : ""}"><div class="n">${i + 1}</div>${l === "km" ? rIn + wIn : wIn + rIn}
          <button class="tick" type="button" data-act="toggle" data-ex="${esc(ex.id)}" data-i="${i}" aria-label="Satz ${i + 1} erledigt" aria-pressed="${st.done}"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>`;
      }).join("");
      const complete = e.sets.every(x => x.done);
      const isPr = l === "kg" && best > 0 && prev > 0 && best > prev + 0.01;
      let chip = "";
      if (sug) {
        if (sug.harder) chip = `<span class="chip up">↑ Variante erschweren</span>`;
        else if (sug.up) chip = pw && pw.phase && pw.phase.hold ? `<span class="chip">Gewicht halten</span>` : `<span class="chip up">↑ ${fmt(sug.w)} kg</span>`;
      }
      if (isPr) chip += `<span class="chip pr">Rekord</span>`;
      const lastLine = last ? `<span>Zuletzt <b>${last.sets.map(x => setText(ex, x)).join(" · ")}</b></span>` : "";
      const lblL = l === "kg" ? "kg" : "km";
      const lblR = (u === "Wdh" ? "Wdh" : u) + (ex.perSide ? " / Seite" : "");
      const labels = hasLoad ? (l === "km" ? `<span></span><span>min</span><span>km</span><span></span>` : `<span></span><span>${lblL}</span><span>${lblR}</span><span></span>`) : `<span></span><span>${lblR}</span><span></span>`;
      return `<section class="ex ${complete ? "complete" : ""}">
        <div class="ex-head"><h2 class="ex-name"><span class="i">${complete ? "✓" : n + 1}</span><span>${esc(ex.name)}${isExtra ? `<span class="extra-tag">nur heute</span>` : ""}</span></h2>
          <div class="ex-target">${ex.sets}×${range(ex.repsMin, ex.repsMax)}${unitShort(ex)}${ex.perSide ? "<small>pro Seite</small>" : ""}</div></div>
        ${techPanel(ex)}
        ${lastLine || chip ? `<div class="last">${lastLine}${chip}</div>` : ""}
        <div class="sets"><div class="srow lbl ${hasLoad ? "" : "one"}">${labels}</div>${rows}</div>
        <div class="ex-foot"><span>${isExtra ? `<button class="link danger" type="button" data-act="extra-del" data-ex="${esc(ex.id)}" style="padding-left:0">Entfernen</button>` : isKraft(day) ? "Pause " + restText(ex) : ""}</span>
          <span><button class="link muted" type="button" data-act="del-set" data-ex="${esc(ex.id)}" aria-label="Satz entfernen">− Satz</button> <button class="link" type="button" data-act="add-set" data-ex="${esc(ex.id)}">+ Satz</button></span></div>
      </section>`;
    }).join("");

    const pct = total ? Math.round(done / total * 100) : 0;
    const kraft = isKraft(day);
    const third = kraft ? `<div class="stat"><div class="v num">${Math.round(vol).toLocaleString("de-DE")}</div><div class="k">kg bewegt</div></div>`
      : `<div class="stat"><div class="v num">${fmt(mins)}<small> min</small></div><div class="k">Dauer</div></div>`;
    const pwk = pw && pw.week >= 1 && pw.week <= pw.weeks ? pw.week : null;
    const stats = `<div class="stats"><div class="stat hi"><div class="v num">${done}<small>/${total}</small></div><div class="k">Sätze</div></div>${third}
      ${day.duration ? `<div class="stat"><div class="v num">${esc(day.duration.replace(/\s*Min\.?/, ""))}<small> min</small></div><div class="k">geplant</div></div>`
        : `<div class="stat"><div class="v num">${pwk ? pwk + "<small>/" + pw.weeks + "</small>" : "–"}</div><div class="k">Woche</div></div>`}</div>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
    const summary = s.finishedAt ? `<section class="summary"><div class="eyebrow" style="color:var(--accent)">Einheit abgeschlossen</div>
      <div class="stats"><div class="stat"><div class="v num">${done}</div><div class="k">Sätze</div></div>
      <div class="stat"><div class="v num">${kraft ? Math.round(vol).toLocaleString("de-DE") : fmt(mins)}</div><div class="k">${kraft ? "kg Volumen" : "Minuten"}</div></div>
      <div class="stat"><div class="v num">${prCount(day, s, ds)}</div><div class="k">Rekorde</div></div></div></section>` : "";
    const deload = pw && pw.phase && pw.phase.deload && kraft ? `<div class="alt">Entlastungswoche: weniger Sätze, Gewichte halten, nicht ans Limit gehen.</div>` : "";
    const sub = [day.focus, day.duration].filter(Boolean).map(esc).join(" · ");

    return `<div class="head"><div class="eyebrow">${dateLabel}</div><h1 class="title">${esc(day.name)}</h1>
        <div class="${KIND_CLASS[day.kind || "kraft"]}"><span class="tag">${esc(sub || KINDS[day.kind || "kraft"])}</span></div>
        ${day.note && !kraft ? `<div class="sub">${esc(day.note)}</div>` : ""}</div>
      ${installHint()}${summary}${stats}${pills}${deload}${cards || `<div class="empty"><h3>Noch keine Übungen</h3><div>Füge hinzu, was du heute machst. Gewicht und Wiederholungen trägst du danach wie gewohnt ein.</div></div>`}
      <button class="addex" type="button" data-act="open-addex">＋ Übung hinzufügen</button>
      <div class="section-t">Notizen</div>
      <textarea id="notes-${id}" data-act="notes" placeholder="${kraft ? "Kettlebell-Gewicht, Technik, Energie …" : "Laufen oder Rad? Strecke, Puls, Gefühl …"}">${esc(s.notes || "")}</textarea>
      <button class="big ${s.finishedAt ? "ghost" : ""}" type="button" data-act="finish">${s.finishedAt ? "Wieder öffnen" : "Einheit abschließen"}</button>`;
  }
  function prCount(day, s, ds) {
    let n = 0;
    for (const e of s.entries) {
      const ex = (day.exercises || []).find(x => x.id === e.exId) || planExByName(e.name) || { name: e.name, unit: e.unit, load: e.load };
      if (LD(ex) !== "kg") continue;
      const prev = bestScore(ex, ds); let best = 0;
      for (const x of e.sets) best = Math.max(best, setScore(ex, x));
      if (prev > 0 && best > prev + 0.01) n++;
    }
    return n;
  }

  // ---------- bottom sheet (phase + rules) ----------
  function sheetWrap(label, inner) { return `<div class="sheet-bg" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}"><div class="grab"></div><div class="in">${inner}</div></div>`; }

  function addExercise(def) {

    else { (s.extras ||= []).push(ex); toast("Für heute hinzugefügt"); }
    touch(s); getSession(S.selDate, day); saveSoon();

    requestAnimationFrame(() => { const el = document.getElementById(`w-${S.selDate}_${day.id}-${ex.id}-0`) || document.getElementById(`r-${S.selDate}_${day.id}-${ex.id}-0`); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" }); });

  // ---------- history ----------
  function exerciseNames() {
    const m = new Map();
    for (const d of days()) for (const e of d.exercises || []) m.set(key(e.name), e.name);
    for (const s of Object.values(DB.sessions)) for (const e of s.entries || []) if (!m.has(key(e.name)) && e.sets.some(x => x.done)) m.set(key(e.name), e.name);
    return [...m.entries()];
  }
  function exMeta(k, label) {
    const p = planExByName(label); if (p) return p;
    for (const s of sessionsList()) { const e = (s.entries || []).find(x => key(x.name) === k); if (e) return { name: e.name, unit: e.unit, load: e.load }; }
    return { name: label };
  }
  function seriesFor(k, ex) {
    const pts = [];
    for (const s of sessionsList().reverse()) {
      const e = (s.entries || []).find(x => key(x.name) === k); if (!e) continue;
      const done = e.sets.filter(x => x.done && x.r != null); if (!done.length) continue;
      const best = done.reduce((a, b) => setScore(ex, b) > setScore(ex, a) ? b : a);
      const v = setScore(ex, best); if (v > 0) pts.push({ date: s.date, v, top: best, sets: done });
    }
    return pts;
  }
  function renderHistory() {
    const names = exerciseNames();
    const sess = sessionsList().filter(s => (s.entries || []).some(e => e.sets.some(x => x.done)));
    const head = `<div class="head"><div class="eyebrow">Fortschritt</div><h1 class="title">Verlauf</h1></div>`;
    if (!sess.length) return head + `<div class="empty"><h3>Noch nichts eingetragen</h3><div>Sobald du Sätze abhakst, siehst du hier deine Entwicklung pro Übung.</div></div>`;
    if (!S.histEx || !names.some(([k]) => k === S.histEx)) S.histEx = (names.find(([k, n]) => seriesFor(k, exMeta(k, n)).length) || names[0])[0];
    const label = names.find(([k]) => k === S.histEx)[1];
    const ex = exMeta(S.histEx, label), pts = seriesFor(S.histEx, ex);
    const r5 = v => strength(ex) ? Math.round(v * 2) / 2 : v;
    const best = pts.length ? Math.max(...pts.map(p => p.v)) : 0;
    const delta = pts.length > 1 ? pts[pts.length - 1].v - pts[0].v : null;
    const opts = names.map(([k, n]) => `<option value="${esc(k)}" ${k === S.histEx ? "selected" : ""}>${esc(n)}</option>`).join("");
    const rows = pts.slice().reverse().slice(0, 30).map(p => `<div class="li"><span class="l">${fmtShort(p.date)}</span><span class="m num">${p.sets.map(x => setText(ex, x)).join(" · ")}</span><span class="r">${fmt(r5(p.v))}</span></div>`).join("");
    const sessRows = sess.slice(0, 20).map(s => {
      let n = 0, vol = 0, mins = 0, km = 0;
      for (const e of s.entries) for (const x of e.sets) if (x.done) {
        n++;
        if ((e.load || "kg") === "kg" && (e.unit || "Wdh") === "Wdh") vol += (x.w || 0) * (x.r || 0);
        if ((e.unit || "Wdh") === "Min") { mins += x.r || 0; km += e.load === "km" ? (x.w || 0) : 0; }
      }
      const r = vol ? `${Math.round(vol).toLocaleString("de-DE")} kg` : mins ? `${fmt(mins)} min${km ? " · " + fmt(km) + " km" : ""}` : `${n} Sätze`;
      return `<div class="li"><span class="l">${WD[wdIndex(parseIso(s.date))]} ${fmtShort(s.date)}</span><span class="m">${esc(s.dayName || "")}${s.notes ? `<small>${esc(s.notes)}</small>` : ""}</span><span class="r">${r}</span></div>`;
    }).join("");
    return head + `<span class="pill" style="justify-self:start">${esc(label)}<span class="chev">▾</span><select id="hist-ex" data-act="hist-ex" aria-label="Übung wählen">${opts}</select></span>
      <section class="panel"><div class="eyebrow">${metricLabel(ex)}</div>
        <div class="stats"><div class="stat hi"><div class="v num">${best ? fmt(r5(best)) : "–"}</div><div class="k">Bestwert</div></div>
        <div class="stat"><div class="v num">${delta == null ? "–" : (delta >= 0 ? "+" : "") + fmt(r5(delta))}</div><div class="k">seit Start</div></div>
        <div class="stat"><div class="v num">${pts.length}</div><div class="k">Einheiten</div></div></div>
        ${pts.length ? chartSvg(pts, ex) : `<div class="sub">Noch keine abgehakten Sätze für diese Übung.</div>`}
        ${strength(ex) ? `<div class="foot-note" style="padding:0">1RM geschätzt nach Epley aus dem besten Satz.</div>` : ""}</section>
      ${rows ? `<div class="section-t">Sätze</div><div class="list">${rows}</div>` : ""}
      <div class="section-t">Letzte Einheiten</div><div class="list">${sessRows}</div>`;
  }
  let chartPts = [], chartEx = null;
  const CW = 520, CH = 220, CL = 46, CR = 16, CT = 18, CB = 28;
  function chartSvg(pts, ex) {
    chartPts = pts; chartEx = ex;
    const vs = pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    const pad = Math.max(1, (hi - lo) * 0.15); lo = Math.max(0, lo - pad); hi += pad;
    const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x = i => pts.length === 1 ? CL + (CW - CL - CR) / 2 : CL + i * (CW - CL - CR) / (pts.length - 1);
    const y = v => CT + (CH - CT - CB) * (1 - (v - lo) / (hi - lo || 1));
    let grid = "";
    for (let v = lo; v <= hi + 1e-9; v += step) grid += `<line x1="${CL}" x2="${CW - CR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${CL - 8}" y="${y(v) + 5}" text-anchor="end" font-size="15" fill="var(--fg-3)" font-family="var(--font-num)">${fmt(v)}</text>`;
    const line = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
    const area = pts.length > 1 ? `<path d="${line} L${x(pts.length - 1)} ${CH - CB} L${x(0)} ${CH - CB} Z" fill="url(#g)"/>` : "";
    const li = pts.length - 1;
    const xl = [...new Set([0, li])].map(i => `<text x="${x(i)}" y="${CH - 6}" text-anchor="${pts.length === 1 ? "middle" : i === 0 ? "start" : "end"}" font-size="15" fill="var(--fg-3)">${fmtShort(pts[i].date)}</text>`).join("");
    const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i === li ? 6 : 3.5}" fill="${i === li ? "var(--accent)" : "var(--bg)"}" stroke="var(--accent)" stroke-width="2"/>`).join("");
    const lv = strength(ex) ? Math.round(pts[li].v * 2) / 2 : pts[li].v;
    return `<div class="chart" id="chart"><svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(metricLabel(ex))}">
      <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".3"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${grid}${area}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line id="cross" x1="0" x2="0" y1="${CT}" y2="${CH - CB}" stroke="var(--fg-3)" stroke-dasharray="3 3" visibility="hidden"/>
      ${dots}<text x="${Math.min(x(li), CW - CR)}" y="${y(pts[li].v) - 12}" text-anchor="${pts.length === 1 ? "middle" : "end"}" font-size="17" font-weight="700" fill="var(--fg)" font-family="var(--font-num)">${fmt(lv)}</text>${xl}
      <rect x="${CL}" y="0" width="${CW - CL - CR}" height="${CH}" fill="transparent"/></svg><div class="tip" id="tip" hidden></div></div>`;
  }
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  function wireChart() {
    const box = document.getElementById("chart"); if (!box) return;
    const svg = box.querySelector("svg"), tip = document.getElementById("tip"), cross = document.getElementById("cross");
    const move = ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * CW, n = chartPts.length;
      const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((px - CL) / ((CW - CL - CR) / (n - 1)))));
      const p = chartPts[i], cx = n === 1 ? CL + (CW - CL - CR) / 2 : CL + i * (CW - CL - CR) / (n - 1);
      const dot = svg.querySelectorAll("circle")[i];
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
      tip.hidden = false; tip.textContent = `${fmtShort(p.date)} · ${setText(chartEx, p.top)}`;
      tip.style.left = Math.max(70, Math.min(r.width - 70, cx / CW * r.width)) + "px"; tip.style.top = (dot.getAttribute("cy") / CH * r.height) + "px";
    };
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
    svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
  }

  // ---------- plan (settings-style editor, saved instantly) ----------
  function sel(obj, cur) { return Object.entries(obj).map(([k, v]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${v}</option>`).join(""); }
  function frow(label, bind, val, mode = "text", ph = "") {
    return `<label class="frow"><span>${label}</span><input id="f-${bind}" data-bind="${bind}" value="${esc(val ?? "")}" inputmode="${mode}" placeholder="${esc(ph)}" autocomplete="off"></label>`;
  }
  function renderPlan() {
    const top = S.nav[S.nav.length - 1];
    if (top && top.t === "ex") return renderExEditor(top.di, top.ei);
    if (top && top.t === "day") return renderDayEditor(top.di);
    const P = DB.plan, prog = P.program || {};
    const sorted = days().map((d, i) => ({ d, i })).sort((a, b) => ((a.d.weekday ?? 9) < 0 ? 9 : a.d.weekday ?? 9) - ((b.d.weekday ?? 9) < 0 ? 9 : b.d.weekday ?? 9));
    const dayRows = sorted.map(({ d, i }) => `<button class="li ${KIND_CLASS[d.kind || "kraft"]}" type="button" data-act="nav-day" data-d="${i}">
